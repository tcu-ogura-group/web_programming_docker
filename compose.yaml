# nginx / php-fpm / mysql を 3 コンテナに分離した構成
# 元の単一コンテナ版 (supervisor で全部起動) は ./Dockerfile.origin に残してあります。
# 設定値は .env に集約 (雛形は .env.example)。

name: ssp

services:
  web:
    image: ${NGINX_IMAGE}
    ports:
      - "${HTTP_BIND}:${HTTP_PORT}:80"
    environment:
      TZ: ${TZ}
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/fastcgi-php.conf:/etc/nginx/snippets/fastcgi-php.conf:ro
      # php コンテナと「同じパス」で同じファイルを見せる必要がある
      - ./html:/var/www/html
      - ./homes/sspuser/public_html:/home/sspuser/public_html
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./php
      args:
        PHP_IMAGE: ${PHP_IMAGE}
        TZ: ${TZ}
    environment:
      TZ: ${TZ}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./html:/var/www/html
      - ./homes/sspuser/public_html:/home/sspuser/public_html
    depends_on:
      - db
    restart: unless-stopped

  db:
    build:
      context: ./db
      args:
        MYSQL_IMAGE: ${MYSQL_IMAGE}
        TZ: ${TZ}
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db-data:
