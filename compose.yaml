# php:8.5-apache (mod_php) / mysql の 2 コンテナ構成
# 元の単一コンテナ版 (ubuntu + supervisor で全部起動) は ./Dockerfile.origin に残してあります。
# 設定値は .env に集約 (雛形は .env.example)。

name: ssp

services:
  web:
    build:
      context: ./web
      args:
        PHP_IMAGE: ${PHP_IMAGE}
        TZ: ${TZ}
    ports:
      - "${HTTP_BIND}:${HTTP_PORT}:80"
    environment:
      TZ: ${TZ}
      SERVER_NAME: ${SERVER_NAME}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./html:/var/www/html
      # /home 丸ごと mount しているので、ユーザー追加は
      # homes/<name>/public_html を mkdir するだけでよい
      - ./homes:/home
    depends_on:
      - db
    restart: unless-stopped

  db:
    build:
      context: ./db
      args:
        MYSQL_IMAGE: ${MYSQL_IMAGE}
        TZ: ${TZ}
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db-data:
