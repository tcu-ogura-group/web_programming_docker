# php:8.5-apache (mod_php) / mysql の 2 コンテナ構成
# 元の単一コンテナ版 (ubuntu + supervisor で全部起動) は ./Dockerfile.origin に残してあります。

name: ssp

services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:${HTTP_PORT:-10800}:80"
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-sspdb}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dbpass}
    volumes:
      - ./html:/var/www/html
      # /home 丸ごと mount しているので、ユーザー追加は
      # homes/<name>/public_html を mkdir するだけでよい
      - ./homes:/home
    depends_on:
      - db
    restart: unless-stopped

  db:
    build: ./db
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dbpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sspdb}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db-data:
