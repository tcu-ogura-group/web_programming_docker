server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /var/www/html;
    index index.html index.htm index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.ht {
        deny all;
    }

    # /~user/foo.php  ->  /home/user/public_html/foo.php  (php コンテナへ)
    location ~ ^/~([^/]+)/(.+\.php)$ {
        alias /home/$1/public_html/$2;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass php:9000;
    }

    # ドキュメントルート配下の PHP
    location ~ \.php$ {
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass php:9000;
    }

    # /~user/...  ->  /home/user/public_html/...  (静的ファイル)
    location ~ ^/~(.+?)(/.*)?$ {
        alias /home/$1/public_html$2;
        autoindex on;
    }
}
