# 「サーバ名を決められない」警告を黙らせるだけ
ServerName localhost

# /~user/foo.php -> /home/user/public_html/foo.php
#
# mods-available/userdir.conf の既定は "UserDir public_html" だが、この形式は
# ホームディレクトリを /etc/passwd から引くため、コンテナ内に user アカウントが
# 必要になる。ワイルドカード形式はパスワードデータベースを見ないので、
# homes/<name>/public_html を mkdir するだけで新しいユーザーを追加できる。
UserDir /home/*/public_html

<Directory /home/*/public_html>
    # Indexes = 元の nginx 版の autoindex on 相当
    Options Indexes FollowSymLinks MultiViews
    AllowOverride FileInfo AuthConfig Limit Indexes
    Require method GET POST OPTIONS
</Directory>
